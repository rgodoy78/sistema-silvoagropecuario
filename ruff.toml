target-version = "py313"
line-length = 120
extend-exclude = ["src/*/migrations"]

[lint]
# E/F/W: errores básicos · I: imports · B: bugs comunes · S: seguridad (bandit) · DJ: Django
select = ["E", "F", "W", "I", "B", "S", "DJ", "UP"]
ignore = ["S101"]

[lint.per-file-ignores]
"src/*/tests.py" = ["S105", "S106"]
