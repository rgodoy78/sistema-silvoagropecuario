{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<p><a href="{% url 'livestock:animal_detail' animal.pk %}">« {{ animal }}</a></p>
<h1>{{ title }}</h1>
<div class="card">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <div class="actions"><button type="submit">Guardar</button></div>
  </form>
</div>
{% endblock %}
