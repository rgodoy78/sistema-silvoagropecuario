{% load l10n %}{% localize off %}<ul class="meters">
  {% for item in items %}
  <li>
    <span>{{ item.label }}</span><span class="num">{{ item.pct }} %</span>
    <svg viewBox="0 0 100 6" preserveAspectRatio="none" role="img" aria-label="{{ item.label }}: {{ item.pct }} %">
      <rect width="100" height="6" class="meter-track"/>
      <rect width="{{ item.pct }}" height="6" class="meter-fill"/>
    </svg>
  </li>
  {% endfor %}
</ul>{% endlocalize %}
