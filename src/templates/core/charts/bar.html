{% load l10n %}{# Coordenadas SVG: siempre con punto decimal, sin localizar. #}{% localize off %}<svg class="chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ title }}">
  {% for g in chart.grid %}
  <line x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ g.y }}" y2="{{ g.y }}" class="grid"/>
  <text x="{{ chart.left|add:'-8' }}" y="{{ g.y }}" class="axis" text-anchor="end" dominant-baseline="middle">{{ g.label }}</text>
  {% endfor %}
  {% for b in chart.bars %}
  <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="4" class="bar series-{{ color|default:1 }}"><title>{{ b.label }}: {{ b.value }}</title></rect>
  <text x="{{ b.cx }}" y="{{ b.y }}" dy="-6" class="value" text-anchor="middle">{{ b.value }}</text>
  <text x="{{ b.cx }}" y="{{ chart.bottom }}" dy="18" class="axis" text-anchor="middle">{{ b.label }}</text>
  {% endfor %}
</svg>{% endlocalize %}
