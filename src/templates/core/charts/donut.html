{% load l10n %}{# Coordenadas SVG: siempre con punto decimal, sin localizar. #}{% localize off %}<div class="donut-wrap">
  <svg class="donut" viewBox="0 0 42 42" role="img" aria-label="{{ title }}">
    <circle cx="21" cy="21" r="15.9155" class="donut-track"/>
    {% for s in chart.segments %}
    <circle cx="21" cy="21" r="15.9155" class="donut-seg series-{{ s.color }}" stroke-dasharray="{{ s.dash }}" stroke-dashoffset="{{ s.offset }}"><title>{{ s.label }}: {{ s.value }} ({{ s.pct }} %)</title></circle>
    {% endfor %}
    <text x="21" y="20" class="donut-total" text-anchor="middle">{{ chart.total }}</text>
    <text x="21" y="25.5" class="donut-unit" text-anchor="middle">{{ unit }}</text>
  </svg>
  <ul class="legend legend-col">
    {% for s in chart.segments %}<li><span class="swatch series-{{ s.color }}"></span>{{ s.label }} <strong>{{ s.pct }} %</strong></li>{% endfor %}
  </ul>
</div>{% endlocalize %}
