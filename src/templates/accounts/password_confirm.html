{% extends "auth_base.html" %}
{% block content %}
<div class="card">
  <h1>{{ action }}</h1>
  <p class="muted">Confirma tu contraseña para continuar.</p>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <div class="actions">
      <button type="submit"{% if danger %} class="danger"{% endif %}>{{ action }}</button>
      <a href="{% url 'accounts:otp_setup' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
