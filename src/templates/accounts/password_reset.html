{% extends "auth_base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="card">
  <h1>Recuperar contraseña</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <div class="actions"><button type="submit">Enviar enlace</button><a href="{% url 'accounts:login' %}">Volver</a></div>
  </form>
</div>
{% endblock %}
