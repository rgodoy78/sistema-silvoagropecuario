{% extends "auth_base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="card">
  {% if validlink %}
    <h1>Nueva contraseña</h1>
    <form method="post">
      {% csrf_token %}
      {{ form }}
      <div class="actions"><button type="submit">Guardar</button></div>
    </form>
  {% else %}
    <h1>Enlace no válido</h1>
    <p>El enlace ya se usó o venció. <a href="{% url 'accounts:password_reset' %}">Solicita uno nuevo</a>.</p>
  {% endif %}
</div>
{% endblock %}
