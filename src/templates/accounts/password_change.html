{% extends "auth_base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="card">
  <h1>Cambiar contraseña</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <div class="actions"><button type="submit">Cambiar</button><a href="{% url 'accounts:profile' %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
